<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DXF Wall & Profile Inspector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>DXF Tool</h2>
        <div class="control">
            <label>1. Select File:</label>
            <input type="file" id="dxfFile" accept=".dxf">
            <label>2. Filter Layer:</label>
            <select id="layerSelect" disabled><option>Upload file first...</option></select>
            <label>3. Paper width (cm):</label>
            <input type="number" id="paperWidth">
        </div>
        <hr>
        <div class="control">
            <p><b>Instructions:</b><br>
            • Click line: Select/deselect single line.<br>
            • <b>Shift + Click</b>: Select/deselect line which the paper width will be deducted.<br>
            • Scroll to zoom, drag to pan.</p>
        </div>
        <div class="control">
            <p>Selected Count: <span id="selCount">0</span></p>
            <button id="setHeightBtn" disabled><strong>Set Height for Selected</strong></button>
            <button id="addLayer" disabled><strong>Add Layer</strong></button>
            <button id="clearSelBtn" disabled><strong>Clear Selection</strong></button>
        </div>
        <div class="control">
            <button id="genBtn" disabled><strong>Generate Perfil DXF</strong></button>
        </div>
    </div>
    <div id="main">
        <canvas id="viewport"></canvas>
    </div>
    <script src="app.js"></script>
</body>
</html>
